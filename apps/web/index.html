<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Unofficial tool to upgrade Betaflight firmware and carry your configuration across versions." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Betaflight Migrator</title>

    <!-- Link previews in chats and social sites. Crawlers need absolute URLs, and cache the image by URL:
         bump og:image's ?v= when you replace og-image.jpg, so they fetch it again. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="fc-migrate.com" />
    <meta property="og:url" content="https://fc-migrate.com/" />
    <meta property="og:title" content="Betaflight Migrator" />
    <meta property="og:description" content="Unofficial tool to upgrade Betaflight firmware and carry your configuration across versions." />
    <meta property="og:image" content="https://fc-migrate.com/og-image.jpg?v=1" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="8-bit pixel art: worker bees leave a grumpy grey queen for a golden queen sipping a milkshake." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
